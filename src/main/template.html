<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
  </header>
  <div class="content">
    <div class="sidebar">
      <h3>Todo List</h3>
      <div class="wrapper">
        <div id="list" class="lists">
          <button class="btn" id="all"><i class="fa fa-list"></i> All todos</button>
          <button class="btn"><i class="fa fa-calendar"></i> Today</button>
          <button class="btn bottom"><i class="fa fa-check"></i> Completed</button>
        </div>
        <hr>
        <div class="projects" id="projects">
          <h3>Projects</h3>
          <button class="btn"><i class="fa fa-folder"></i> Default</button>
        </div>
        <div class="new">
          <button class="addBtn fx-10 new-btn"><span class="btn-label"><i class="fa fa-plus"></i> New
              Project</span></button>
        </div>
      </div>
    </div>
    <div class="lists" id="content"></div>
  </div>
</body>

</html>
